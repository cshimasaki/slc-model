# Display metadata for the assumptions layer: the label and unit each
# parameter carried in the workbook"s "Control & Parameters" sheet.
#
# Kept separate from the scenario files on purpose. base.yaml is the layer a
# non-coder edits, and it stays readable by holding values and nothing else.
# This file is documentation, not input -- nothing here changes a result.
# `row` is the source row in Control & Parameters, for tracing back.
# `derived: true` marks a value the model computes rather than reads. Those
# appear here (readers want to see them) but not in base.yaml (nobody should
# edit them directly).


macro_indexation:
  _title: "Macro & Indexation"
  cpi_general:
    label: "General CPI inflation"
    unit: "% p.a."
    row: 8
  rent_inflation:
    label: "Rent inflation"
    unit: "% p.a."
    row: 9
  hpi_premium:
    label: "HPI premium over CPI"
    unit: "% p.a."
    row: 10
  base_calendar_year:
    label: "Base calendar year (Year 1)"
    unit: "year"
    row: 11

