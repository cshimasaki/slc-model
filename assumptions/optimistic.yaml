# =============================================================================
# OPTIMISTIC SCENARIO — deltas from base.yaml
# =============================================================================
# Question this scenario answers:
#   "If the fundraising environment, the housing market and our own delivery
#    capacity all run in our favour, how much land can the Commons hold?"
#
# Narrative: inflation runs lower (2.0%) while rents and house prices run
# higher (3.0% rent growth, 2.0% HPI premium over CPI); voids fall to 3%;
# community-share take-up is half again as strong and withdrawals halve;
# gifts and bequests grow 2% p.a. in real terms; lenders allow 75% LTV at a
# cheaper 4.5%; the portfolio ceiling lifts to 250 properties and doubles
# every 3 years instead of 4. The one-off house-price shock is set to +10%
# but never fires, because hpi_shock_year stays 0 (inherited from Base).
#
# Every key not listed here is inherited from base.yaml unchanged.
# =============================================================================

macro_indexation:
  cpi_general: 0.02          # was 0.029 — inflation settles back below target
  rent_inflation: 0.03       # was 0.037 — rents ease but still run ahead of CPI
  # was -0.009 — the long-run pattern reasserts itself and house prices outrun
  # general inflation again. Note this is the LESS favourable direction for a
  # buyer: houses getting dearer faster than everything else is what made the
  # commons necessary. It sits in Optimistic because it lifts asset values and
  # therefore gearing headroom, which is the sense in which the model calls it
  # optimistic -- a reminder that the scenario names are about SLC's balance
  # sheet, not about the housing market being good for anybody.
  hpi_premium: 0.02

tontine_fund:
  pf_ltv_limit: 0.75         # was 0.70 — lenders allow more gearing
  pf_refi_rate: 0.045        # was 0.055 — cheaper commercial debt

community_shares:
  cs_issue_cost_pct: 0.04    # was 0.05 — cheaper to raise
  cs_takeup_mult: 1.5        # was 1.0 — stronger community appetite
  cs_withdrawal_rate: 0.01   # was 0.02 — members hold their shares longer

bequests_gifts:
  gift_baseline: 60000       # was 40000
  beq_baseline: 90000        # was 60000
  beq_growth_mult: 0.02      # was 0.0 — giving grows in real terms
  # Credibility arrives sooner and compounds: the Commons demonstrates benefit
  # earlier, so property gifts start at year 10 rather than 15 and run at one a
  # year rather than one every other year.
  gift_property_start_yr: 10  # was 15
  gift_property_rate: 1.0     # was 0.5

rent_yield:
  # was 0.05. Read this as buying BETTER, not charging more: a higher yield here
  # means properties acquired at keener prices, off-market or from motivated
  # sellers, at the same rent. Rent stays below market in every scenario -- that
  # is a commitment, not a variable, and raising it to make a covenant work is
  # explicitly not available. See the note on gross_yield in base.yaml.
  gross_yield: 0.055
  # was 2.0 months. A maintenance function that matures faster: better
  # contractor rates, fewer emergency call-outs, planned rather than reactive.
  # 1.6 months leaves the Commons 86.7% of gross rent at small scale.
  lc_maintenance_months: 1.6
  void_rate: 0.03            # was 0.05

operating_efficiency:
  # The service company matures faster and negotiates harder.
  opex_learning_rate: 0.88       # was 0.92 — 12% off per doubling
  opex_efficiency_floor: 0.55    # was 0.65

growth_curve:
  logistic_ceiling: 250      # was 200 properties
  logistic_dbl_yrs: 3        # was 4 years

capex_maintenance:
  sinking_return: 0.02       # was 0.0 — sinking fund earns a return

market_shock:
  hpi_shock_pct: 0.10        # was -0.20; inert here, hpi_shock_year is 0
