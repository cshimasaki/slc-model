# =============================================================================
# STROUD LAND COMMONS — BASE SCENARIO ASSUMPTIONS
# =============================================================================
# This file is the full parameter set. Optimistic and Stress hold only the
# values that differ from these, so a diff between two scenario files IS the
# scenario definition.
#
# Sections and parameter names mirror the "Control & Parameters" sheet of
# "Financial Modelling for SLC V2.1.xlsx" exactly. Each key is the Excel
# named range the workbook's own formulas use, so a formula that read
# `pf_ltv_limit` in Excel reads `pf_ltv_limit` here.
#
# Percentages are stored as fractions: 0.025 means 2.5% p.a.
# "real" means in Year-1 money, before the model applies indexation.
#
# NOT AN INPUT: `pf_coupon_spread` (the implied SLC coupon) is derived by the
# model as pf_investor_rate + pf_fund_op_margin + pf_fund_reg_charge, exactly
# as the workbook derives it with =SUM(E14:E16). Change the three components,
# not the total.
# =============================================================================

macro_indexation:
  # Set to the published UK position, August 2026, rather than the long-run
  # averages the workbook carried.
  #
  #   CPI          2.9%  (12 months to July 2026, ONS)
  #   Private rent 3.7%  (12 months to July 2026, ONS)
  #   House prices 2.0%  (12 months to June 2026, ONS)
  #
  # The workbook assumed rent = CPI and houses = CPI + 1.0%. Both are currently
  # wrong, and the second is wrong in sign: rents are outgrowing house prices by
  # 170bp, where the model had houses ahead by 100bp. That 270bp swing matters
  # more than any other parameter here, because it decides whether a debt limit
  # set against property VALUE stays affordable out of RENT.
  #
  # Health warning: these are single-year prints, not fifty-year assumptions.
  # Held flat for fifty years, hpi_premium of -0.9% means real house prices fall
  # to about 0.64 of today's by year 50. For an organisation that never sells
  # that is survivable and arguably helpful -- cheaper to buy, and the asset
  # value only matters for gearing headroom -- but it is a strong claim and it
  # is not what the last thirty years did. Treat Base as "the present continues"
  # and use the scenarios for the alternatives.
  cpi_general: 0.029         # General CPI inflation (% p.a.)
  rent_inflation: 0.037      # Rent inflation (% p.a.)
  hpi_premium: -0.009        # HPI premium over CPI (% p.a.) — negative: houses
                             # are currently growing slower than prices generally
  base_calendar_year: 2026   # Calendar year that model Year 1 represents

tontine_fund:
  # Closed-end lifetime annuity mutual. Interest-only and index-linked: the
  # principal is uplifted each year rather than amortised, and from
  # pf_release_start_yr a slice of the balance is released to SLC reserves each
  # year as a non-cash credit (a parametric proxy for annuitant survivorship).
  pf_index_label: Rent           # Display label only. The behaviour is set by
                                 # pf_index_basis below; this is the workbook's
                                 # text field and is kept in step with it.
  # CPI + 4.25%. Raised from 2.5% in August 2026 after modelling what the
  # investor actually receives.
  #
  # The principal is never repaid, so the coupon IS the entire return. At 2.5%
  # an investor recovers about 55% of their capital over their expected life
  # and does not break even until age 104 -- i.e. never. That is philanthropy
  # with a yield, not the "small bet on longevity" the design intends, and it
  # will not raise money from anyone comparing it with an annuity.
  #
  # The frontier, on current assumptions. Ceiling = highest rate with ZERO
  # covenant breaches in that scenario:
  #     Optimistic  6.00%
  #     Base        4.28%
  #     Stress      3.77%   <- the binding one
  #     Investor    4.58%   needed to break even by median survival (age 87)
  #
  # There is no rate that clears every scenario AND pays the investor back:
  # the gap is 81bp. 4.25% is set here as a deliberate choice -- Base and
  # Optimistic stay covenant-clean, Stress breaches in 10 of 50 years. That is
  # a judgement that a severe stress (15% voids, CPI 4.5%, a housing crash,
  # halved take-up, no gifts ever) is allowed to breach a self-imposed
  # covenant. If the covenant is meant to hold in all worlds, the rate must
  # fall to 3.75% and the investor recovers only ~82% of capital.
  #
  # Closing the gap properly needs the levers on SLC's side -- gift income,
  # scale efficiency, a lower LTV -- not a higher coupon. This is the single
  # most important open question in the model. See MODEL_LOG.
  pf_investor_rate: 0.0425       # Target investor annuity rate, spread over index (% p.a.)

  # How the coupon rate is applied to the (already CPI-uplifted) principal.
  #   real     coupon = spread only. The investor's inflation protection
  #            comes from the growing principal; the spread is their real
  #            return. Matches the indicative actuarial model and the
  #            design intent of a CPI + 2.5% annuity.
  #   nominal  coupon = CPI + spread, as the original workbook had it.
  #            Applied to an indexed principal this pays CPI twice and
  #            doubles the investor's real return -- 5.0% instead of 2.5%.
  # See MODEL_LOG: this was an error inherited from the spreadsheet.
  pf_coupon_basis: real

  # What the Tontine principal is indexed to.
  #
  #   rent  the local rent the properties actually earn. The default, and the
  #         one that matches what the charge is secured on: once a house enters
  #         the Commons it is never sold, so its market price is a number that
  #         never gets tested, while its rent is the only cash that exists.
  #         Indexing to rent means the liability and the income backing it move
  #         together, and cover cannot drift because the two grew apart.
  #   cpi   general consumer prices. Protects the investor's spending power
  #         rather than tracking the asset, and is what the workbook did.
  #   hpi   house prices. Tracks the asset's capital value, which for an
  #         organisation that never sells is the least meaningful of the three.
  #
  # This is a genuine choice with different winners, not a technicality. In a
  # period when house prices outrun rents, CPI or HPI indexation transmits that
  # gap into the liability, and the only ways back to covenant are higher rent
  # or slower growth. Rent indexation cannot do that by construction.
  pf_index_basis: rent

  # Fund running costs.
  #
  # Previously a flat 0.50% margin on the fund. That is wrong at both ends: on a
  # GBP 4m fund it yields GBP 20,000, which does not pay for an actuarial
  # valuation, and on a GBP 200m fund it yields GBP 1m for the same function.
  # The cost is mostly a person, not a percentage.
  #
  # Modelled instead as a staffed cost that ramps: part-time and pro-rata at the
  # start, growing to a full role with bought-in actuarial and audit as the fund
  # becomes material. Board and trustees are assumed voluntary or on small
  # honoraria, so they are not a salary line here.
  #
  # It is charged as an operating cost of the Commons, NOT added to the coupon.
  # The investor receives pf_investor_rate; running the fund is what it costs
  # SLC to offer the instrument, and it belongs in opex where it reduces the
  # operating surplus and shows up honestly in cover.
  # The ramp is driven by how much has been RAISED, not by how many years have
  # passed. Staffing follows the work: a fund that never grows never needs the
  # full role, and a time-based ramp would put a salary on it anyway.
  pf_fund_admin_early: 12000     # Part-time administrator, pro-rata (real GBP p.a.)
  pf_fund_admin_target: 55000    # Full role plus actuarial and audit (real GBP p.a.)
  pf_fund_admin_mature_raise: 20000000   # Raise at which the full role is needed (GBP)
  pf_fund_op_margin: 0.0         # Superseded by the staffed cost above; kept at
                                 # zero so the derived coupon is investor + reg
                                 # only. The workbook's 0.005 survives in the
                                 # frozen port-reference assumptions.
  pf_fund_reg_charge: 0.0025     # Regulatory capital charge (% p.a.) — genuinely
                                 # proportional to the fund, so still a rate
  pf_max_raise: 50000000         # Tontine maximum raise (£)
  pf_invest_phase_yrs: 10        # Investment phase duration (years) — drawdowns only within this window
  pf_release_start_yr: 25        # Release phase start (model year)

  # How the charge is discharged once the release phase begins.
  #
  #   geometric  the original workbook's rule: a flat percentage of the
  #              outstanding balance each year. Decays but never reaches zero,
  #              so more than a third is still outstanding at year 50.
  #   survivorship  the instrument as designed: each drawdown is a cohort of
  #              investors, SLC pays a coupon while they live, and on death
  #              the coupon stops and the charge is extinguished with no
  #              principal repaid. Mortality is the only mechanism.
  #
  # There is no release schedule and no redemption date: a tontine charge ends
  # when its investor does. pf_release_start_yr therefore has no effect in
  # survivorship mode -- it belongs to the geometric rule only.
  pf_release_mode: survivorship
  pf_release_rate: 0.06          # geometric mode only: % of outstanding balance p.a.

  # Minimum term: a charge cannot be released in the first few years after the
  # investment, however unlucky the investor.
  pf_lockup_years: 5

  # What happens to a dead investor's capital.
  #   1.0  the charge is extinguished and the Commons holds the property free
  #        of it. This is the mechanic as currently described.
  #   0.0  nothing is extinguished; the entitlement passes to the surviving
  #        investors, lifting their yield without reducing what SLC owes --
  #        the classic tontine survivorship benefit.
  # Anything between splits it.
  #
  # UNDECIDED — see MODEL_LOG. A split would raise investor yield, and with it
  # possibly the rate of new investment, at direct cost to SLC's balance sheet.
  # It is the single most consequential open parameter in the Tontine.
  pf_mortality_gain_to_commons: 1.0


  pf_ltv_limit: 0.70             # LTV limit (% of portfolio value)
  pf_refi_toggle: 0              # Refinance into commercial mortgage? (1 = Yes)
  pf_refi_year: 26               # Refinancing year (model year)
  pf_refi_rate: 0.055            # Commercial mortgage rate (% p.a.)
  pf_refi_amort_yrs: 25          # Commercial mortgage amortisation (years)

community_shares:
  # Junior debt. Withdrawable after a restriction period, capped as a share of
  # total capital, and paying a dividend only out of available surplus.
  # The rate the offer document ADVERTISES. Under the Co-operative and Community
  # Benefit Societies Act 2014 this is a ceiling, not a promise: it must be the
  # minimum necessary to attract and retain the capital, profits cannot be
  # distributed on share capital, and payment is at the board's discretion.
  # Societies routinely pay nothing for the first few years and step up once the
  # project is cash-generative. The model pays it only where surplus allows, and
  # records the gap in cs_interest_shortfall.
  cs_dividend_rate: 0.03         # Advertised interest rate, capped (% p.a.)

  # Pay share interest only after the reserve has been topped up, not merely
  # after the annuity interest. This is what makes "interest eats the project"
  # structurally impossible rather than just unlikely: shareholders are paid
  # from money that has already passed every other claim, including the buffer
  # the annuity itself depends on.
  cs_interest_after_reserve: true
  cs_max_pct_capital: 0.20       # Maximum issuance cap (% of total capital)
  # Withdrawal restriction period. The workbook had 5; the actual share offer
  # terms are 2, corrected Aug 2026.
  #
  # Note what the model does with this: withdrawals each year are a fixed rate
  # applied to the closing balance from this many years ago. That makes the
  # withdrawal line a smooth, lagged echo of the issuance line. Real
  # withdrawals will be lumpier -- driven by individual circumstances and
  # likely to cluster if confidence dips or a dividend is cut. The smoothness
  # is a property of the deterministic mechanic, not a forecast. See MODEL_LOG.
  cs_withdrawal_years: 2
  cs_issue_cost_pct: 0.05        # Issuance / marketing cost (% of proceeds)
  cs_baseline_issue: 250000      # Baseline annual issuance, real (£ p.a.)
  cs_takeup_mult: 1.0            # Take-up multiplier (x)
  cs_withdrawal_rate: 0.02       # Annual withdrawal rate on eligible shares (% p.a.)

funding_mix:
  # What proportion of each year's planned purchases comes from where.
  #
  # THESE WEIGHTS ARE JUDGEMENT, NOT EVIDENCE. They were offered as "just
  # numbers in my head... it feels like a fairly plausible ratio", and should
  # be read that way until there is real fundraising experience to replace
  # them. Together with cs_baseline_issue and the gift lines, they are the
  # least evidenced and most consequential inputs in the model.
  #
  # The reasoning behind the shape: the Tontine leads early because that is
  # where retired people's capital sits, and because a new organisation has no
  # track record to sell community shares against. As the balance sheet grows
  # and the evidence accumulates, shares and Rent Credit Obligations take over.
  #
  # Gifts are NOT targeted -- you cannot decide to receive one. They arrive on
  # their own terms and reduce what the others must find. The residual weight
  # is an expectation of gifts and RCOs, not an instruction.
  #
  # The Tontine takes the slack: if shares fall short or gifts do not arrive,
  # it covers the difference, subject only to its LTV headroom and raise cap.
  # The ceiling on the Tontine is viability, not a quota.
  #
  # Set cs_issue_mode to "fixed" to ignore all of this and revert to a flat
  # annual share issuance, which is what the V2.1 spreadsheet did.
  cs_issue_mode: share_of_need   # "share_of_need" | "fixed"

  mix_tontine_start: 0.80        # year 1
  mix_shares_start: 0.15         # remainder (5%) expected from gifts and RCOs
  mix_tontine_end: 0.30          # after the transition
  mix_shares_end: 0.50           # remainder (20%) from gifts and RCOs
  mix_transition_years: 30       # linear glide; a placeholder shape, not a forecast

bequests_gifts:
  gift_baseline: 40000           # Cash gifts from living donors, Gift Aid eligible (£ p.a.)
  beq_baseline: 60000            # Bequests from estates, not Gift Aid eligible (£ p.a.)
  founding_capital: 150000       # Founding capital injection, Year 1 only (£)
  beq_growth_mult: 0.0           # Real growth multiplier on gifts and bequests (% p.a.)

  # --- Property gifts (in kind, not cash) -----------------------------------
  # A house given to the Commons outright: no purchase price, no debt, no LTV
  # draw, earning rent from the year it arrives. There is currently no vehicle
  # for gifting property this way in Stroud or in much of the UK.
  #
  # Deliberately conservative. Nobody gives away a house to an organisation
  # with no track record, so gifts are treated as EARNED by demonstrated
  # community benefit rather than assumed from the outset -- hence a start year
  # rather than just a rate. Base assumes nothing at all for the first 14 years,
  # then one house every other year.
  #
  # The rate may be fractional: entitlement accumulates and a house arrives when
  # it crosses one whole property, so gifts are lumpy rather than smeared.
  gift_property_start_yr: 15     # First year gifts begin accruing (0 = never). At a
                                 # rate of 0.5 the first whole house arrives in
                                 # year 16.
  gift_property_rate: 0.5        # Properties gifted per year once started
  gift_property_retrofit_mult: 3.0   # Retrofit on receipt, as a multiple of the
                                     # standard retrofit_cost. Gifted stock tends
                                     # to be older and to need more work than a
                                     # property chosen and bought on the market.

rent_yield:

  # gross_yield is DERIVED from stock_mix below -- it is total rent over total
  # price across the acquisition mix. Raising it was briefly used as a covenant
  # lever before anyone worked out that it meant a 10% rent rise paid by
  # tenants. Rent stays below market; the way to a better yield is buying
  # better stock, which is now an explicit decision rather than a dial.

  # What maintenance and the other running costs of the houses absorb, stated
  # the way the trade states it: about two months of rent out of twelve. That is
  # 16.67%, not the 20% the workbook carried, and it leaves 83.33% to the
  # Commons at the start.
  #
  # It falls with scale for the same reasons per-property admin does -- batched
  # gas safety rounds, materials bought in bulk, contracted volume worth
  # negotiating over. Same learning-curve form as engine/efficiency.py: a fixed
  # proportion off for every doubling of the portfolio.
  #
  # The floor matters. Maintenance is not procurement leverage all the way down;
  # somebody still has to attend the property and fix the roof. At 0.65 the cost
  # share bottoms out around 10.8% of rent, i.e. 1.3 months -- a well-run estate
  # at scale, not a free one.
  lc_maintenance_months: 2.0     # Months of rent absorbed by maintenance and other
                                 # property running costs, at small scale
  lc_cost_learning_rate: 0.95    # Saving per doubling of the portfolio (5% off)
  lc_cost_floor: 0.65            # Floor on that cost share, as a fraction of the
                                 # small-scale share
  # lc_share is now DERIVED from the three lines above (1 minus the cost share)
  # and varies by year. The frozen port-reference assumptions still carry a flat
  # lc_share: 0.80, which is what reproduces the workbook.
  void_rate: 0.05                # Void rate (%)

stock_mix:
  # WHAT WE BUY. The largest single lever in the model, and not a financing one.
  #
  # Rent tracks BEDROOMS; price tracks PROPERTY TYPE. They come apart, and that
  # gap is the whole point of this section. Stroud, ONS mid-2026:
  #
  #     Terraced 3-bed      GBP 287,000   GBP 1,176 pcm   4.92%
  #     Semi-detached 3-bed GBP 342,000   GBP 1,176 pcm   4.13%
  #     Terraced 2-bed      GBP 287,000   GBP   960 pcm   4.01%
  #     Flat/maisonette 2-b GBP 166,000   GBP   960 pcm   6.94%
  #
  # A 3-bed terrace and a 3-bed semi let for exactly the same money, and the
  # semi costs GBP 55,000 more -- 19% more capital for identical income. The
  # spread between the best and worst stock here is wider than moving the LTV
  # limit from 70% to 30%.
  #
  # Prices are ONS averages for the property TYPE across the district, matched
  # to ONS average rent for that BEDROOM count. Do not take the district average
  # rent (GBP 1,039) over the district average price (GBP 349,000): those are
  # different populations -- the sale figure includes GBP 563,000 detached
  # houses that never reach the rental market -- and dividing one by the other
  # understates the yield on lettable stock by about 140bp.
  #
  # The default mix leans on 3-bed terraces as the core of the portfolio, with
  # some flats for yield and a small number of semis. It is a policy choice, not
  # a forecast, and it is the first thing to change when testing what the
  # Commons should be buying.
  stock_types:
    - name: "Terraced, 3-bed"
      share: 0.50
      price: 287000
      rent_pcm: 1176
    - name: "Flat / maisonette, 2-bed"
      share: 0.20
      price: 166000
      rent_pcm: 960
    - name: "Terraced, 2-bed"
      share: 0.20
      price: 287000
      rent_pcm: 960
    - name: "Semi-detached, 3-bed"
      share: 0.10
      price: 342000
      rent_pcm: 1176

acquisition:

  # avg_price is DERIVED from stock_mix below.
  sdlt_rate: 0.0                 # SDLT rate — 0 assumes charitable relief (% of price)
  conveyancing: 2500             # Conveyancing per property, real (£)
  survey_cost: 800               # Survey per property, real (£)
  retrofit_cost: 5000            # Initial retrofit per property, real (£)

admin_costs_early:
  # Costs in the earliest years, before the organisation reaches target scale.
  # The model ramps linearly from these to the target values below, reaching
  # target at `logistic_start_yr`.
  board_early: 0                 # Board remuneration (£ p.a.)
  acct_early: 3000               # Accounting & audit (£ p.a.)
  fca_early: 1500                # FCA & annual reporting (£ p.a.)
  ins_early: 1000                # Insurance (£ p.a.)

admin_costs_target:
  board_target: 12000            # Board remuneration (£ p.a.)
  acct_target: 8000              # Accounting & audit (£ p.a.)
  fca_target: 3000               # FCA & annual reporting (£ p.a.)
  ins_target: 2000               # Insurance (£ p.a.)
  # Zero, deliberately. Property-level admin is already inside the 16.67% of
  # rent taken by lc_maintenance_months, which covers admin AND maintenance.
  # Charging it here as well counted the same cost twice. Kept as a
  # parameter rather than deleted because the frozen port-reference
  # assumptions still carry the workbook's 150 and must keep reproducing it.
  admin_per_prop: 0              # Variable admin per property (GBP/property/yr)

reserves:
  reserve_tgt_months: 6          # Target reserve (months of debt service)
  reserve_min_months: 3          # Minimum covenant (months of debt service)
  reserve_build_year: 10         # Target reserve fully built by (model year)
  min_cash_buffer: 25000         # Minimum operating cash buffer (£)

growth_curve:
  # Years 1-3 are absolute acquisition counts. From `logistic_start_yr` the
  # model switches to a logistic S-curve with intrinsic rate ln(2)/doubling.
  acq_year1: 1                   # Properties acquired — Year 1
  acq_year2: 2                   # Properties acquired — Year 2
  acq_year3: 3                   # Properties acquired — Year 3
  logistic_start_yr: 4           # Logistic growth begins (model year)
  logistic_floor: 3              # Logistic floor, min acquisitions p.a. (properties)
  logistic_ceiling: 200          # Logistic ceiling, max portfolio (properties)
  logistic_dbl_yrs: 4            # Doubling rate (years)

operating_efficiency:
  # Per-property running costs fall as the estate grows: materials bought in
  # bulk, gas safety checks batched across a round of properties rather than
  # booked one at a time, and enough contracted volume to negotiate on price.
  #
  # A learning curve, the standard form for procurement: unit cost falls by a
  # fixed proportion for every DOUBLING of the portfolio. The shape is the
  # point -- the first ten houses buy most of the saving, the two hundredth
  # buys almost none.
  #
  # Applies to `admin_per_prop` and `maint_per_prop`. NOT to
  # `sinking_per_prop`, which is a provision against future capital works
  # rather than a running cost: the roof still needs replacing whatever the
  # estate paid for the scaffolding.
  #
  # WHERE THE SAVING GOES IS NOT MODELLED. Here it simply improves the surplus
  # and stays with the Commons. The intent is to share it between tenants and
  # investors and most likely consume it through retrofitting -- a rent
  # reduction and capex respectively, neither of which is represented. Read
  # these figures as the size of the prize, not the gain to the balance sheet.
  #
  # Set opex_learning_rate to 1.0 to switch the whole mechanism off.
  opex_learning_rate: 0.92       # each doubling of the portfolio takes 8% off per-property cost
  opex_efficiency_floor: 0.65    # never below 65% of the small-scale cost

capex_maintenance:
  sinking_per_prop: 1500         # Sinking fund contribution (£ / property / yr)
  # Zero, for the same reason: day-to-day and structural repairs are inside
  # the 16.67%. The SINKING FUND below stays separate -- major works and
  # retrofit are lumpy, long-dated and not fundable out of a share of
  # monthly rent. The intention is to fund those with short-dated shares
  # issued against a specific programme, which raises rent marginally for
  # the houses in that pool. Not yet modelled.
  maint_per_prop: 0              # Structural maintenance spend (GBP/property/yr)
  sinking_return: 0.0            # Sinking fund investment return (% p.a.)

market_shock:
  # A one-off house-price shock, optionally followed by a period of suppressed
  # rent growth. Inert unless hpi_shock_year > 0.
  hpi_shock_year: 0              # One-off HPI shock year (0 = none)
  hpi_shock_pct: -0.20           # One-off HPI shock (%)
  rent_shock_years: 0            # Rent shock duration following HPI shock (years)
  rent_shock_rate: 0.0           # Rent inflation during shock (% p.a.)

tax_gift_aid:
  ct_exempt_toggle: 1            # Corporation tax exempt? (1 = Yes)
  ct_rate: 0.25                  # Corporation tax rate if not exempt (%)
  gift_aid_toggle: 1             # Gift Aid applicable? (1 = Yes)
  gift_aid_rate: 0.25            # Gift Aid recovery rate (% of qualifying gifts)

covenants:
  # Self-imposed. There is no lender requiring these -- which makes stating
  # them, and the reasoning, more important rather than less.
  #
  # Note what the Tontine is: interest-only, no maturity, no amortisation, and
  # it extinguishes on death. Over 50 years the model repays GBP 0 of
  # principal. So these are INTEREST cover tests, not debt-service cover, and
  # the refinancing risk a geared commercial borrower carries is absent. UK
  # housing associations typically covenant interest cover at 1.10-1.50; the
  # structural case here is for the lower half of that range, and the gift
  # dependency and single-locality concentration are what argue it back up.

  # 1. Cash interest cover: rent plus CASH gifts and Gift Aid, over interest.
  #    Excludes donated property -- income and an asset, but not money, and
  #    interest cannot be paid with a house.
  cov_cash_cover_min: 1.25

  # 2. Rent-only interest cover: no gifts at all, contractual or not. Asks
  #    whether the portfolio can service its own debt. This is the test that
  #    actually disciplines the plan, and it is the one currently failing.
  cov_rent_only_min: 1.00
  cov_rent_only_by_year: 20     # year by which test 2 should be met

  # 3. The third test is test 1 measured under a CPI +2pt world rather than a
  #    separate ratio, because the coupon is CPI-linked and reprices at once
  #    while rents review annually. The Stress scenario already is CPI +2.

  # The original self-imposed figure, kept so the old series stays readable.
  cov_legacy_dscr_min: 1.20

funding_discipline:
  constrain_growth: 1            # Cap acquisitions at affordable level? (1 = Yes)

monthly_timing:
  # Drives the Monthly Cash Flow view (years 1-5 only). Does not affect the
  # annual figures — it only phases them within each year.
  acq_month: 12                  # Month in year when acquisitions complete (1-12)
  debt_pay_freq: 4               # Debt service payments per year
  div_month: 12                  # Month in year when dividends are paid (1-12)
