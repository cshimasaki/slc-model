# =============================================================================
# STRESS SCENARIO — deltas from base.yaml
# =============================================================================
# Question this scenario answers:
#   "Can the Commons survive a bad decade — high inflation, empty properties,
#    a collapse in community-share appetite and a housing crash — without
#    breaching its covenants or running out of cash?"
#
# Narrative:
#   - Void rate +10 points, to 15%
#   - CPI +2 points, to 4.5%
#   - Community-share take-up halved (0.5x)
#   - A one-off -20% house-price shock in Year 5
#   - Rent growth held at 0% for the two years following the shock
#
# Note on inheritance, mirroring the workbook: the -20% shock size and the 0%
# shocked-rent rate are NOT set here — they are inherited from base.yaml,
# where they already sit as hpi_shock_pct: -0.20 and rent_shock_rate: 0.0.
# What Stress actually changes is switching the shock ON (hpi_shock_year: 5)
# and giving it a two-year rent tail (rent_shock_years: 2). Base holds the
# same shock definition dormant with hpi_shock_year: 0.
#
# Rent inflation and the HPI premium are also inherited from Base rather than
# worsened — the stress here is the shock and the voids, not a permanently
# weaker rental market.
#
# Every key not listed here is inherited from base.yaml unchanged.
# =============================================================================

macro_indexation:
  # was 0.029 — high inflation on costs, while rent inflation is held down to
  # base (3.7%) rather than following it. That 80bp real squeeze on rents is
  # the heart of this scenario: costs run away and the income does not follow.
  cpi_general: 0.045
  # was -0.009 — house prices track CPI plus a point, so the ASSET inflates at
  # 5.5% while the RENT that services the charge grows at 3.7%. Under an LTV
  # limit that gap is what quietly destroys cover, because the borrowing limit
  # is set against value and the covenant is tested against rent. It is also
  # exactly what pf_index_basis: rent is there to neutralise.
  hpi_premium: 0.01

community_shares:
  cs_takeup_mult: 0.5        # was 1.0 — community-share appetite halves

acquisition:
  # Stress puts its pressure on RETROFIT rather than on voids or ongoing
  # maintenance, because that is where the real uncertainty sits. The
  # houses let easily; what is unknown is what they cost to bring up to
  # standard once the surveys are in.
  retrofit_cost: 18000       # was 12000 — works run 50% over

rent_yield:

  # was 0.15, which was never credible for this organisation and made Stress
  # fail for a reason that could not happen. With a waiting list of
  # pre-selected tenants and security of tenure, 5% is the realistic CEILING
  # -- a bad year of turnover and slow works, not an inability to let.
  void_rate: 0.05            # was 0.15 — the ceiling, not a collapse in demand

  # was 3.0. Two months is the maximum on decent stock, so Stress sits just
  # above it: 2.5 months, which is deferred repairs coming due at once and
  # contractors charging more in an inflationary period. Even this is
  # described as unlikely given the stock selection policy.
  lc_maintenance_months: 2.5

bequests_gifts:
  # No property gifts at all. Gifts are earned by demonstrated benefit, and the
  # stress case is precisely the world where that case never becomes compelling
  # enough for someone to hand over a house.
  gift_property_start_yr: 0  # was 15; 0 = never

market_shock:
  hpi_shock_year: 5          # was 0 (dormant) — fires the -20% shock inherited from Base
  rent_shock_years: 2        # was 0 — rent growth held at the inherited 0% for two years

operating_efficiency:
  # No scale economies materialise. Contractors do not discount, the service
  # company never gets good enough at it, and cost per property stays flat.
  opex_learning_rate: 1.0        # was 0.92 — mechanism off

stock_mix:
  # The stock available is worse and dearer: competition from private buyers
  # pushes the Commons toward semis and away from the flats and terraces that
  # earn best. Blended yield falls to about 4.4% with no change in rent policy.
  stock_types:
    - name: "Terraced, 3-bed"
      share: 0.40
      price: 287000
      rent_pcm: 1176
    - name: "Semi-detached, 3-bed"
      share: 0.35
      price: 342000
      rent_pcm: 1176
    - name: "Terraced, 2-bed"
      share: 0.25
      price: 287000
      rent_pcm: 960
